<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b1020; --card: #121a33; --text: #f1f5f9; --muted: #94a3b8; --accent: #4ade80; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 16px; box-sizing: border-box; }
  h1 { margin: 0 0 8px; font-size: 36px; }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; width: 100%; max-width: 640px; }
  a.card { display: block; background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 24px; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  a.card h2 { margin: 0 0 6px; font-size: 22px; }
  a.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  a.card span { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="sub">Pick a game to play in your browser.</p>
  <div class="grid">
    <a class="card" href="serpent-feast/serpent-feast.html">
      <h2>Serpent Feast</h2>
      <p>Eat coins and smaller snakes to grow. Avoid the giants. Climb 10 levels.</p>
      <span>Play &rarr;</span>
    </a>
    <a class="card" href="marsh-shot/marsh-shot.html">
      <h2>Marsh Shot</h2>
      <p>Shoot the ducks and reach the goal before time runs out. Build combos to level up.</p>
      <span>Play &rarr;</span>
    </a>
  </div>
</body>
</html>
